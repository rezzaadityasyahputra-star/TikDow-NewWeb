<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RezTik | TikTok Downloader Elegant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #000000);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(45deg, #00f2fe, #4facfe, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }

        /* Animasi Titik Tiga */
        .menu-dot {
            width: 6px;
            height: 6px;
            background-color: #00f2fe;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .menu-container:hover .dot-1 { transform: translateX(5px); }
        .menu-container:hover .dot-3 { transform: translateX(-5px); }
        
        /* State aktif saat dipencet */
        .menu-container.active .dot-1 { transform: translateY(12px) scale(1.2); background-color: #ff0055; }
        .menu-container.active .dot-2 { transform: scale(0.8); opacity: 0.5; }
        .menu-container.active .dot-3 { transform: translateY(-12px) scale(1.2); background-color: #7000ff; }

        /* Dropdown Menu Style */
        #sideMenu {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px) translateX(-10px);
            transition: all 0.3s ease;
        }
        .menu-container.active #sideMenu {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) translateX(0);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div class="fixed top-8 left-8 z-50">
        <div onclick="toggleMenu(this)" class="menu-container cursor-pointer flex flex-col gap-1.5 p-2 group relative">
            <div class="menu-dot dot-1"></div>
            <div class="menu-dot dot-2"></div>
            <div class="menu-dot dot-3"></div>

            <div id="sideMenu" class="absolute top-12 left-0 w-48 glass rounded-2xl p-2 shadow-2xl">
                <button onclick="alert('Fitur History segera hadir!')" class="w-full text-left px-4 py-3 hover:bg-white/10 rounded-xl transition-colors flex items-center gap-3 group/item">
                    <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center group-hover/item:bg-cyan-500 transition-colors">
                        <i class="fas fa-history text-cyan-400 group-hover/item:text-black text-xs"></i>
                    </div>
                    <span class="text-sm font-medium">History</span>
                </button>
                
                <button onclick="alert('RezTik v1.0 - Dibuat dengan menggunakan html')" class="w-full text-left px-4 py-3 hover:bg-white/10 rounded-xl transition-colors flex items-center gap-3 group/item">
                    <div class="w-8 h-8 rounded-lg bg-purple-500/20 flex items-center justify-center group-hover/item:bg-purple-500 transition-colors">
                        <i class="fas fa-info-circle text-purple-400 group-hover/item:text-white text-xs"></i>
                    </div>
                    <span class="text-sm font-medium">About App</span>
                </button>
            </div>
        </div>
    </div>

    <header class="text-center mb-10 animate__animated animate__fadeInDown">
        <h1 class="text-6xl font-extrabold mb-2 tracking-tighter">
            Rez<span class="gradient-text">Tik</span>
        </h1>
        <p class="text-gray-400 text-sm tracking-widest uppercase">Premium TikTok Downloader</p>
    </header>

    <main class="w-full max-w-2xl glass rounded-3xl p-8 shadow-2xl animate__animated animate__zoomIn">
        <div class="relative group">
            <input type="text" id="urlInput" placeholder="Tempel link TikTok di sini..." 
                class="w-full bg-black/40 border-2 border-white/10 rounded-2xl py-5 px-6 focus:outline-none focus:border-cyan-500 transition-all text-white placeholder-gray-500">
            <button onclick="downloadVideo()" id="btnDownload"
                class="absolute right-2 top-2 bottom-2 px-8 bg-cyan-500 rounded-xl font-bold text-black hover:bg-white transition-all btn-hover">
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <div id="loader" class="hidden mt-10 text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-500"></div>
            <p class="mt-4 text-cyan-500 animate__animated animate__pulse animate__infinite">Sedang memproses keajaiban...</p>
        </div>

        <div id="result" class="hidden mt-10 animate__animated animate__fadeInUp">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/2">
                    <img id="thumb" src="" alt="Thumbnail" class="rounded-2xl shadow-lg border border-white/10">
                </div>
                <div class="w-full md:w-1/2 flex flex-col justify-center gap-4">
                    <h3 id="author" class="text-xl font-bold text-white">@username</h3>
                    <p id="desc" class="text-gray-400 text-sm line-clamp-2"></p>
                    
                    <a id="hdLink" href="#" target="_blank" class="flex items-center justify-center gap-3 bg-gradient-to-r from-cyan-500 to-blue-500 py-4 rounded-xl font-bold text-white btn-hover transition-all">
                        <i class="fas fa-video"></i> Download Video (No WM)
                    </a>
                    <a id="musicLink" href="#" target="_blank" class="flex items-center justify-center gap-3 bg-white/10 py-4 rounded-xl font-bold text-white hover:bg-white/20 transition-all">
                        <i class="fas fa-music"></i> Download MP3 Audio
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-12 text-gray-500 text-xs animate__animated animate__fadeIn">
        &copy; 2024 <span class="text-cyan-500">RezTik</span>. Terinspirasi oleh Kecepatan & Keindahan.
    </footer>

    <script>
        function toggleMenu(el) {
            el.classList.toggle('active');
            
            // Menutup menu jika klik di luar
            const closeOnClickOutside = (e) => {
                if (!el.contains(e.target)) {
                    el.classList.remove('active');
                    document.removeEventListener('click', closeOnClickOutside);
                }
            };
            
            if(el.classList.contains('active')) {
                setTimeout(() => {
                    document.addEventListener('click', closeOnClickOutside);
                }, 10);
            }
        }

        async function downloadVideo() {
            const urlInput = document.getElementById('urlInput').value;
            const btn = document.getElementById('btnDownload');
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');

            if (!urlInput) {
                alert('LINK GAK ADA WOY!');
                return;
            }

            loader.classList.remove('hidden');
            result.classList.add('hidden');
            btn.disabled = true;

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (data.code === 0) {
                    const videoData = data.data;
                    document.getElementById('thumb').src = videoData.cover;
                    document.getElementById('author').innerText = `@${videoData.author.unique_id}`;
                    document.getElementById('desc').innerText = videoData.title || "No Description";
                    document.getElementById('hdLink').href = videoData.play;
                    document.getElementById('musicLink').href = videoData.music;

                    loader.classList.add('hidden');
                    result.classList.remove('hidden');
                } else {
                    alert('Gagal mengambil video. Pastikan link benar.');
                    loader.classList.add('hidden');
                }
            } catch (error) {
                console.error(error);
                alert('Terjadi kesalahan jaringan.');
                loader.classList.add('hidden');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
