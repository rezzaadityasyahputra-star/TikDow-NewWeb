<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2ea;
            --secondary: #ff0050;
            --dark: #010101;
            --glass: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 234, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 80, 0.15) 0%, transparent 40%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Sidebar Navigation */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1000;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar.active {
            left: 0;
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }

        .menu-btn {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.05);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .menu-btn:hover {
            background: white;
            color: black;
            transform: translateX(10px);
        }

        .header-controls {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1001;
        }

        .toggle-icon {
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
            color: var(--accent);
        }

        /* Main UI Container */
        .main-card {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transition: 0.5s;
        }

        .logo-box {
            position: relative;
            margin-bottom: 30px;
            display: inline-block;
        }

        .tiktok-icon {
            font-size: 80px;
            color: white;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(-3px -3px 0px var(--primary)) 
                    drop-shadow(3px 3px 0px var(--secondary));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 { font-size: 28px; margin-bottom: 8px; font-weight: 800; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 35px; }

        /* Input & Button */
        .input-wrapper { margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 18px 25px;
            border-radius: 15px;
            border: 2px solid transparent;
            background: rgba(0,0,0,0.3);
            color: white;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }

        .dl-button {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(45deg, #00f2ea, #ff0050);
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.4s;
        }

        .dl-button:hover:not(:disabled) { transform: translateY(-3px); filter: brightness(1.1); }
        .dl-button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Result Section */
        #resultArea {
            display: none;
            margin-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .video-info { margin-bottom: 20px; }
        .thumbnail {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 10px;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-download {
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-hd { background: var(--primary); color: #000; }
        .btn-music { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 999;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="header-controls">
        <i class="fas fa-bars-staggered toggle-icon" onclick="toggleMenu()"></i>
    </div>

    <nav class="sidebar" id="sidebar">
        <button class="menu-btn"><i class="fas fa-clock-rotate-left"></i> IG DOWNLOADER</button>
<button class="menu-btn"><i class="fas fa-heart"></i> BERANDA</button>
        <button class="menu-btn" onclick="location.reload()"><i class="fas fa-refresh"></i> YT DOWNLOADER</button>
    </nav>

    <div class="main-card">
        <div class="logo-box">
            <i class="fab fa-tiktok tiktok-icon"></i>
        </div>
        
        <h1>REZ<span style="color: var(--primary)">TIKDOW</span></h1>
        <p class="subtitle">Unduh video HD tanpa watermark secara gratis</p>

        <div class="input-wrapper">
            <input type="text" id="videoUrl" placeholder="Tempel tautan TikTok di sini...">
        </div>

        <button class="dl-button" id="btnDownload">
            <i class="fas fa-cloud-arrow-down"></i>
            <span id="btnText">CARI VIDEO</span>
        </button>

        <!-- Hasil Muncul di Sini -->
        <div id="resultArea">
            <div class="video-info">
                <img src="" id="resThumb" class="thumbnail" alt="thumbnail">
                <h3 id="resTitle" style="font-size: 16px; margin-bottom: 5px;"></h3>
                <p id="resAuthor" style="color: var(--primary); font-size: 14px;"></p>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><i class="fas fa-play"></i> <span id="resViews">0</span></div>
                <div class="stat-item"><i class="fas fa-heart"></i> <span id="resLikes">0</span></div>
                <div class="stat-item"><i class="fas fa-share"></i> <span id="resShares">0</span></div>
            </div>

            <div class="action-btns">
                <a href="" id="linkNoWm" target="_blank" class="btn-download btn-hd">
                    <i class="fas fa-download"></i> Video No Watermark (Server 1)
                </a>
                <a href="" id="linkHd" target="_blank" class="btn-download btn-hd" style="background: var(--secondary); color: white;">
                    <i class="fas fa-bolt"></i> Video HD Quality
                </a>
                <a href="" id="linkMusic" target="_blank" class="btn-download btn-music">
                    <i class="fas fa-music"></i> Download Musik (MP3)
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        const btnDownload = document.getElementById('btnDownload');
        const btnText = document.getElementById('btnText');
        const inputUrl = document.getElementById('videoUrl');
        const resultArea = document.getElementById('resultArea');

        btnDownload.addEventListener('click', async () => {
            const url = inputUrl.value.trim();
            if (!url) return alert("Masukkan URL TikTok!");

            // UI Loading State
            btnDownload.disabled = true;
            btnText.innerText = "Sedang Memproses...";
            resultArea.style.display = "none";

            try {
                const response = await fetch(`https://api.sxtream.my.id/downloader/tiktok?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.status === 200) {
                    const result = data.result;
                    
                    // Isi Data ke UI
                    document.getElementById('resThumb').src = result.cover;
                    document.getElementById('resTitle').innerText = result.title || "TikTok Video";
                    document.getElementById('resAuthor').innerText = `@${result.author.nickname}`;
                    document.getElementById('resViews').innerText = result.stats.views;
                    document.getElementById('resLikes').innerText = result.stats.likes;
                    document.getElementById('resShares').innerText = result.stats.share;

                    // Set Link Download
                    // Filter data array untuk mendapatkan URL video
                    const noWm = result.data.find(d => d.type === "nowatermark")?.url;
                    const noWmHd = result.data.find(d => d.type === "nowatermark_hd")?.url;

                    document.getElementById('linkNoWm').href = noWm;
                    document.getElementById('linkHd').href = noWmHd || noWm;
                    document.getElementById('linkMusic').href = result.music_info.url;

                    // Tampilkan Hasil
                    resultArea.style.display = "block";
                } else {
                    alert("Gagal mengambil video. Pastikan link benar!");
                }
            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan pada server!");
            } finally {
                btnDownload.disabled = false;
                btnText.innerText = "Unduh Sekarang";
            }
        });
    </script>
</body>
    </html>
